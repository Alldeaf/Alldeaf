<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alldeaf</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-appearance: none;
    }

    button {
        -webkit-appearance: none;
        appearance: none;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(180deg, #dfe4ea 0%, #ccd3dc 100%);
        color: #1d2433;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                     "SF Pro Text", Arial, sans-serif;
        overflow-x: hidden;
    }

    .app {
        min-height: calc(100vh - 32px);
        max-width: 560px;
        margin: 16px auto 0;
        padding: 22px 16px 36px;
        position: relative;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 32px;
        box-shadow: 0 16px 30px rgba(103, 115, 144, 0.06);
        backdrop-filter: blur(14px) saturate(80%);
        -webkit-backdrop-filter: blur(14px) saturate(80%);
    }

    /* Alldeaf сверху по центру */
    .top-logo {
        text-align: center;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.8px;
        margin-bottom: 28px;
        color: rgba(25, 35, 51, 0.82);
        text-shadow: 0 1px 0 rgba(255,255,255,0.18);
    }

    .screen {
        display: none;
        background: transparent;
        border: none;
        border-radius: 0;
        padding: 0;
        box-shadow: none;
    }

    .screen.active {
        display: block;
    }

    /* Главная */
    .home {
        padding-top: 6px;
    }

    .slogan {
        text-align: center;
        font-size: 17px;
        color: rgba(65, 77, 98, 0.76);
        margin-bottom: 24px;
        letter-spacing: 0.1px;
    }

    .home-buttons {
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    /* Карточки */
    .home-button {
        width: 100%;
        min-height: 158px;
        padding: 22px;
        border: 1px solid rgba(255,255,255,0.32);
        border-radius: 26px;
        background: rgba(255,255,255,0.08);
        color: #1d2433;
        text-align: left;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.3);
        backdrop-filter: blur(14px) saturate(80%);
        -webkit-backdrop-filter: blur(14px) saturate(80%);
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: flex-start;
        transition:
            transform 0.16s cubic-bezier(.2,.8,.2,1),
            border-color 0.16s ease,
            background 0.16s ease,
            box-shadow 0.16s ease,
            filter 0.16s ease;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        will-change: transform, box-shadow, filter;
    }

    .home-button:hover {
        background: rgba(255,255,255,0.17);
    }

    .home-button:active,
    .home-button.is-pressed {
        transform: translateY(2px) scale(0.985);
        background: rgba(255,255,255,0.12);
        border-color: rgba(255,255,255,0.25);
        box-shadow:
            inset 0 2px 8px rgba(119, 131, 156, 0.12),
            0 5px 12px rgba(132, 141, 164, 0.08);
        filter: brightness(0.985) saturate(0.96);
    }

    .icon-box {
        width: 36px;
        height: 36px;
        margin-bottom: 18px;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        background: rgba(255,255,255,0.12);
        border: 1px solid rgba(255,255,255,0.38);
        border-radius: 12px;
        padding: 6px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.38);
    }

    .icon {
        width: 28px;
        height: 28px;
        stroke: #202b3a;
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .home-title {
        font-size: 20px;
        font-weight: 650;
        margin-bottom: 7px;
        line-height: 1.2;
        color: #1b2432;
    }

    .home-description {
        font-size: 14px;
        line-height: 1.45;
        color: rgba(52, 66, 86, 0.76);
        max-width: 360px;
    }

    /* Внутренние страницы */
    .back {
        border: none;
        background: transparent;
        padding: 0;
        margin-bottom: 18px;
        font-size: 16px;
        color: rgba(29, 36, 51, 0.8);
        cursor: pointer;
    }

    .page-title {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.7px;
        margin: 0 0 18px;
        color: #1e2a39;
    }

    .result-box,
    .text-input {
        width: 100%;
        min-height: 220px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 20px;
        padding: 18px;
        font-family: inherit;
        font-size: 17px;
        line-height: 1.5;
        color: #1d2433;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.16);
    }

    .result-box {
        overflow-y: auto;
    }

    .placeholder {
        color: rgba(86, 98, 118, 0.66);
    }

    .text-input {
        resize: none;
        outline: none;
    }

    .text-input:focus {
        border-color: rgba(112, 145, 255, 0.72);
        box-shadow: 0 0 0 3px rgba(124, 150, 255, 0.12);
    }

    /* Кнопки */
    .button-column {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 16px;
    }

    .main-button,
    .clear-button {
        width: 100%;
        cursor: pointer;
        font-family: inherit;
        font-weight: 600;
        touch-action: manipulation;
        border-radius: 20px;
    }

    .main-button {
        height: 58px;
        border: 1px solid rgba(255,255,255,0.22);
        background: rgba(255,255,255,0.06);
        color: #1d2433;
        font-size: 17px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.2);
        backdrop-filter: blur(12px) saturate(80%);
        -webkit-backdrop-filter: blur(12px) saturate(80%);
        transition:
            transform 0.16s cubic-bezier(.2,.8,.2,1),
            filter 0.16s ease,
            opacity 0.16s ease,
            box-shadow 0.16s ease,
            background 0.16s ease;
        will-change: transform, box-shadow, filter, opacity;
    }

    .main-button:hover,
    .clear-button:hover {
        filter: brightness(1.02);
    }

    .main-button:active,
    .main-button.is-pressed,
    .clear-button:active,
    .clear-button.is-pressed {
        transform: translateY(2px) scale(0.975);
        filter: brightness(0.98) saturate(0.96);
        opacity: 0.97;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 4px 10px rgba(130, 138, 155, 0.06);
    }

    .main-button.active {
        background: linear-gradient(135deg, rgba(255, 168, 168, 0.18) 0%, rgba(255, 123, 123, 0.18) 100%);
        border-color: rgba(255,255,255,0.46);
        color: #1d2433;
    }

    @media (hover: none) and (pointer: coarse) {
        .home-button:active,
        .home-button.is-pressed,
        .main-button:active,
        .main-button.is-pressed,
        .clear-button:active,
        .clear-button.is-pressed {
            transform: translateY(2px) scale(0.97);
            box-shadow: 0 3px 8px rgba(122, 145, 255, 0.08);
        }
    }

    .clear-button {
        height: 52px;
        border: 1px solid rgba(255,255,255,0.46);
        border-radius: 18px;
        background: rgba(255,255,255,0.10);
        color: #1d2433;
        font-size: 16px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.42);
        backdrop-filter: blur(16px) saturate(90%);
        -webkit-backdrop-filter: blur(16px) saturate(90%);
    }
</style>
</head>

<body>

<div class="app">

    <!-- ALldeaf -->
    <div class="top-logo">Alldeaf</div>

    <!-- Главный экран -->
    <section class="screen active" id="homeScreen">

        <div class="home">

            <div class="slogan">Связь без звука</div>

            <div class="home-buttons">

                <!-- Слушать -->
                <button class="home-button" id="listenOpen">

                    <div class="icon-box">
                        <svg class="icon" viewBox="0 0 24 24">
                            <path d="M12 3a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"/>
                            <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>
                            <path d="M12 18v3"/>
                            <path d="M8 21h8"/>
                        </svg>
                    </div>

                    <div class="home-title">Слушать</div>

                    <div class="home-description">
                        Превращает речь собеседника в текст на экране
                    </div>

                </button>


                <!-- Говорить -->
                <button class="home-button" id="speakOpen">

                    <div class="icon-box">
                        <svg class="icon" viewBox="0 0 24 24">
                            <path d="M4 5h16v10H8l-4 4V5Z"/>
                            <path d="M8 9h8"/>
                            <path d="M8 12h5"/>
                        </svg>
                    </div>

                    <div class="home-title">Говорить</div>

                    <div class="home-description">
                        Озвучивает ваш текст вслух для собеседника
                    </div>

                </button>

            </div>

        </div>

    </section>


    <!-- Экран Слушать -->
    <section class="screen" id="listenScreen">

        <button class="back" id="backFromListen">‹ Назад</button>

        <h1 class="page-title">Слушать</h1>

        <div class="result-box" id="speechText">
            <span class="placeholder">Здесь появится текст...</span>
        </div>

        <div class="button-column">

            <button class="main-button" id="listenButton">
                Начать слушать
            </button>

            <button class="clear-button" id="clearListen">
                Очистить
            </button>

        </div>

    </section>


    <!-- Экран Говорить -->
    <section class="screen" id="speakScreen">

        <button class="back" id="backFromSpeak">‹ Назад</button>

        <h1 class="page-title">Говорить</h1>

        <textarea
            class="text-input"
            id="speakText"
            placeholder="Напишите текст..."
        ></textarea>

        <div class="button-column">

            <button class="main-button" id="speakButton">
                Озвучить
            </button>

            <button class="clear-button" id="clearSpeak">
                Очистить
            </button>

        </div>

    </section>

</div>


<script>

    const homeScreen = document.getElementById("homeScreen");
    const listenScreen = document.getElementById("listenScreen");
    const speakScreen = document.getElementById("speakScreen");

    const listenOpen = document.getElementById("listenOpen");
    const speakOpen = document.getElementById("speakOpen");

    const backFromListen = document.getElementById("backFromListen");
    const backFromSpeak = document.getElementById("backFromSpeak");

    const listenButton = document.getElementById("listenButton");
    const clearListen = document.getElementById("clearListen");
    const speechText = document.getElementById("speechText");

    const speakButton = document.getElementById("speakButton");
    const clearSpeak = document.getElementById("clearSpeak");
    const speakText = document.getElementById("speakText");

    document.querySelectorAll(".home-button, .main-button, .clear-button").forEach((button) => {
        const setPressed = (pressed) => {
            button.classList.toggle("is-pressed", pressed);
        };

        button.addEventListener("pointerdown", () => setPressed(true));
        button.addEventListener("pointerup", () => setPressed(false));
        button.addEventListener("pointerleave", () => setPressed(false));
        button.addEventListener("pointercancel", () => setPressed(false));
    });


    /* Переключение экранов */
    function showScreen(screen) {

        homeScreen.classList.remove("active");
        listenScreen.classList.remove("active");
        speakScreen.classList.remove("active");

        screen.classList.add("active");
    }


    /* Открыть Слушать */
    listenOpen.addEventListener("click", () => {
        showScreen(listenScreen);
    });


    /* Открыть Говорить */
    speakOpen.addEventListener("click", () => {
        showScreen(speakScreen);
    });


    /* Назад из Слушать */
    backFromListen.addEventListener("click", () => {

        stopListening();

        showScreen(homeScreen);
    });


    /* Назад из Говорить */
    backFromSpeak.addEventListener("click", () => {

        speechSynthesis.cancel();

        speakButton.classList.remove("active");
        speakButton.textContent = "Озвучить";

        showScreen(homeScreen);
    });


    /* =========================
       РАСПОЗНАВАНИЕ РЕЧИ
       ========================= */

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    let recognition = null;
    let listening = false;


    if (SpeechRecognition) {

        recognition = new SpeechRecognition();

        recognition.lang = "ru-RU";
        recognition.continuous = true;
        recognition.interimResults = true;


        recognition.onresult = function(event) {

            let finalText = "";

            for (
                let i = event.resultIndex;
                i < event.results.length;
                i++
            ) {

                finalText += event.results[i][0].transcript;
            }

            if (finalText.trim()) {

                speechText.textContent = finalText;
            }
        };


        recognition.onend = function() {

            if (listening) {

                try {
                    recognition.start();
                } catch (e) {}

            }
        };


        recognition.onerror = function() {

            listening = false;

            listenButton.classList.remove("active");
            listenButton.textContent = "Начать слушать";
        };

    } else {

        listenButton.addEventListener("click", () => {

            speechText.textContent =
                "Распознавание речи не поддерживается этим браузером.";

        });
    }


    /* Начать слушать */
    function startListening() {

        if (!recognition) {
            speechText.textContent = "Распознавание речи не поддерживается в этом браузере. Откройте сайт в Chrome или Edge на iPhone.";
            return;
        }

        listening = true;

        speechText.innerHTML = "";

        listenButton.classList.add("active");
        listenButton.textContent = "Остановить";


        try {
            recognition.start();
        } catch (e) {}
    }


    /* Остановить слушание */
    function stopListening() {

        listening = false;

        if (recognition) {

            try {
                recognition.stop();
            } catch (e) {}
        }

        listenButton.classList.remove("active");
        listenButton.textContent = "Начать слушать";
    }


    let listenPressLocked = false;

    function toggleListenButton() {
        if (listenPressLocked) return;

        listenPressLocked = true;
        setTimeout(() => {
            listenPressLocked = false;
        }, 220);

        if (listening) {
            stopListening();
        } else {
            startListening();
        }
    }

    listenButton.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        toggleListenButton();
    });

    listenButton.addEventListener("click", (event) => {
        event.preventDefault();
        toggleListenButton();
    });


    /* Очистить текст */
    clearListen.addEventListener("click", () => {

        speechText.innerHTML =
            '<span class="placeholder">Здесь появится текст...</span>';

    });


    /* =========================
       ОЗВУЧИВАНИЕ ТЕКСТА
       ========================= */

    speakButton.addEventListener("click", () => {

        const text = speakText.value.trim();

        if (!text) return;

        speechSynthesis.cancel();

        const voice =
            new SpeechSynthesisUtterance(text);

        voice.lang = "ru-RU";
        voice.rate = 1;
        voice.pitch = 1;


        speakButton.classList.add("active");
        speakButton.textContent = "Говорю...";


        voice.onend = function() {

            speakButton.classList.remove("active");
            speakButton.textContent = "Озвучить";
        };


        voice.onerror = function() {

            speakButton.classList.remove("active");
            speakButton.textContent = "Озвучить";
        };


        speechSynthesis.speak(voice);

    });


    /* Очистить текст */
    clearSpeak.addEventListener("click", () => {

        speechSynthesis.cancel();

        speakText.value = "";

        speakButton.classList.remove("active");
        speakButton.textContent = "Озвучить";

    });

</script>

</body>
</html>
