<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Timezone Digital Clock</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>🌍 Multi-Timezone Digital Clock</h1>
        
        <div class="controls">
            <input type="text" id="timezoneInput" placeholder="Enter timezone (e.g., America/New_York)" />
            <button id="addTimezoneBtn">Add Timezone</button>
        </div>

        <div class="timezone-suggestions">
            <h3>Quick Add:</h3>
            <button class="quick-add" data-tz="America/New_York">New York</button>
            <button class="quick-add" data-tz="Europe/London">London</button>
            <button class="quick-add" data-tz="Asia/Tokyo">Tokyo</button>
            <button class="quick-add" data-tz="Australia/Sydney">Sydney</button>
            <button class="quick-add" data-tz="Asia/Dubai">Dubai</button>
            <button class="quick-add" data-tz="Asia/Kolkata">India</button>
        </div>

        <div id="clocksContainer" class="clocks-container"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
