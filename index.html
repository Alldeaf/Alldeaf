    /* Alldeaf сверху по центру */

    .slogan {

        overflow-y: auto;

    .clear-button:active {

    .main-button.active {

</style>
</head>

<body>

<div class="app">

    <!-- ALldeaf -->
    <div class="top-logo">Alldeaf</div>

    <!-- Главный экран -->
    <section class="screen active" id="homeScreen">

        <div class="home">

            <div class="slogan">Связь без звука</div>

            <div class="home-buttons">

                <!-- Слушать -->
                <button class="home-button" id="listenOpen">

                    <div class="icon-box">
                        <svg class="icon" viewBox="0 0 24 24">
                            <path d="M12 3a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"/>
                            <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>
                            <path d="M12 18v3"/>
                            <path d="M8 21h8"/>
                        </svg>
                    </div>

                    <div class="home-title">Слушать</div>

                    <div class="home-description">
                        Превращает речь собеседника в текст на экране
                    </div>

                </button>


                <!-- Говорить -->
                <button class="home-button" id="speakOpen">

                    <div class="icon-box">
                        <svg class="icon" viewBox="0 0 24 24">
                            <path d="M4 5h16v10H8l-4 4V5Z"/>
                            <path d="M8 9h8"/>
                            <path d="M8 12h5"/>
                        </svg>
                    </div>

                    <div class="home-title">Говорить</div>

                    <div class="home-description">
                        Озвучивает ваш текст вслух для собеседника
                    </div>

                </button>

            </div>

        </div>

    </section>


    <!-- Экран Слушать -->
    <section class="screen" id="listenScreen">

        <button class="back" id="backFromListen">‹ Назад</button>

        <h1 class="page-title">Слушать</h1>

        <div class="result-box" id="speechText">
            <span class="placeholder">Здесь появится текст...</span>
        </div>

        <div class="button-column">

            <button class="main-button" id="listenButton">
                Начать слушать
            </button>

            <button class="clear-button" id="clearListen">
                Очистить
            </button>

        </div>

    </section>


    <!-- Экран Говорить -->
    <section class="screen" id="speakScreen">

        <button class="back" id="backFromSpeak">‹ Назад</button>

        <h1 class="page-title">Говорить</h1>

        <textarea
            class="text-input"
            id="speakText"
            placeholder="Напишите текст..."
        ></textarea>

        <div class="button-column">

            <button class="main-button" id="speakButton">
                Озвучить
            </button>

            <button class="clear-button" id="clearSpeak">
                Очистить
            </button>

        </div>

    </section>

</div>


<script>

    const homeScreen = document.getElementById("homeScreen");
    const listenScreen = document.getElementById("listenScreen");
    const speakScreen = document.getElementById("speakScreen");

    const listenOpen = document.getElementById("listenOpen");
    const speakOpen = document.getElementById("speakOpen");

    const backFromListen = document.getElementById("backFromListen");
    const backFromSpeak = document.getElementById("backFromSpeak");

    const listenButton = document.getElementById("listenButton");
    const clearListen = document.getElementById("clearListen");
    const speechText = document.getElementById("speechText");

    const speakButton = document.getElementById("speakButton");
    const clearSpeak = document.getElementById("clearSpeak");
    const speakText = document.getElementById("speakText");


    /* Переключение экранов */
    function showScreen(screen) {

        homeScreen.classList.remove("active");
        listenScreen.classList.remove("active");
        speakScreen.classList.remove("active");

        screen.classList.add("active");
    }


    /* Открыть Слушать */
    listenOpen.addEventListener("click", () => {
        showScreen(listenScreen);
    });


    /* Открыть Говорить */
    speakOpen.addEventListener("click", () => {
        showScreen(speakScreen);
    });


    /* Назад из Слушать */
    backFromListen.addEventListener("click", () => {

        stopListening();

        showScreen(homeScreen);
    });


    /* Назад из Говорить */
    backFromSpeak.addEventListener("click", () => {

        speechSynthesis.cancel();

        speakButton.classList.remove("active");
        speakButton.textContent = "Озвучить";

        showScreen(homeScreen);
    });


    /* =========================
       РАСПОЗНАВАНИЕ РЕЧИ
       ========================= */

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    let recognition = null;
    let listening = false;


    if (SpeechRecognition) {

        recognition = new SpeechRecognition();

        recognition.lang = "ru-RU";
        recognition.continuous = true;
        recognition.interimResults = true;


        recognition.onresult = function(event) {

            let finalText = "";

            for (
                let i = event.resultIndex;
                i < event.results.length;
                i++
            ) {

                finalText += event.results[i][0].transcript;
            }

            if (finalText.trim()) {

                speechText.textContent = finalText;
            }
        };


        recognition.onend = function() {

            if (listening) {

                try {
                    recognition.start();
                } catch (e) {}

            }
        };


        recognition.onerror = function() {

            listening = false;

            listenButton.classList.remove("active");
            listenButton.textContent = "Начать слушать";
        };

    } else {

        listenButton.addEventListener("click", () => {

            speechText.textContent =
                "Распознавание речи не поддерживается этим браузером.";

        });
    }


    /* Начать слушать */
    function startListening() {

        if (!recognition) return;

        listening = true;

        speechText.innerHTML = "";

        listenButton.classList.add("active");
        listenButton.textContent = "Остановить";


        try {
            recognition.start();
        } catch (e) {}
    }


    /* Остановить слушание */
    function stopListening() {

        listening = false;

        if (recognition) {

            try {
                recognition.stop();
            } catch (e) {}
        }

        listenButton.classList.remove("active");
        listenButton.textContent = "Начать слушать";
    }


    listenButton.addEventListener("click", () => {

        if (listening) {

            stopListening();

        } else {

            startListening();

        }

    });


    /* Очистить текст */
    clearListen.addEventListener("click", () => {

        speechText.innerHTML =
            '<span class="placeholder">Здесь появится текст...</span>';

    });


    /* =========================
       ОЗВУЧИВАНИЕ ТЕКСТА
       ========================= */

    speakButton.addEventListener("click", () => {

        const text = speakText.value.trim();

        if (!text) return;

        speechSynthesis.cancel();

        const voice =
            new SpeechSynthesisUtterance(text);

        voice.lang = "ru-RU";
        voice.rate = 1;
        voice.pitch = 1;


        speakButton.classList.add("active");
        speakButton.textContent = "Говорю...";


        voice.onend = function() {

            speakButton.classList.remove("active");
            speakButton.textContent = "Озвучить";
        };


        voice.onerror = function() {

            speakButton.classList.remove("active");
            speakButton.textContent = "Озвучить";
        };


        speechSynthesis.speak(voice);

    });


    /* Очистить текст */
    clearSpeak.addEventListener("click", () => {

        speechSynthesis.cancel();

        speakText.value = "";

        speakButton.classList.remove("active");
        speakButton.textContent = "Озвучить";

    });

</script>

</body>
</html>
